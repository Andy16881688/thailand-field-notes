<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" role="img" aria-labelledby="title desc"><title id="title">Payment is not the ticket</title><desc id="desc">A payment record, reservation reference and issued travel ticket are different records; reconcile the status and save the issued ticket offline.</desc><rect width="640" height="700" fill="#f8f7f3"/><g font-family="Arial, sans-serif"><text x="28" y="57" font-size="34" fill="#193d35" font-weight="600">Payment is not the ticket</text><text x="28" y="99" font-size="24" fill="#193d35" font-weight="400">Booking evidence · not an app screen</text><path d="M28 121L612 121" fill="none" stroke="#bcc2ba" stroke-width="4"/><rect x="28" y="147" width="584" height="112" rx="10" fill="#e8ece5"/><text x="44" y="186" font-size="28" fill="#193d35" font-weight="400">Payment record</text><text x="44" y="222" font-size="28" fill="#193d35" font-weight="400">Did the charge go through?</text><text x="294" y="307" font-size="40" fill="#b74d35" font-weight="400">≠</text><rect x="28" y="332" width="584" height="112" rx="10" fill="#e8ece5"/><text x="44" y="371" font-size="28" fill="#193d35" font-weight="400">Reservation reference</text><text x="44" y="407" font-size="28" fill="#193d35" font-weight="400">What is the booking status?</text><text x="294" y="492" font-size="40" fill="#b74d35" font-weight="400">≠</text><rect x="28" y="517" width="584" height="126" rx="10" fill="#193d35"/><text x="44" y="558" font-size="30" fill="#f8f7f3" font-weight="400">Issued travel ticket</text><text x="44" y="594" font-size="30" fill="#f8f7f3" font-weight="400">Check details; save offline.</text></g></svg>
