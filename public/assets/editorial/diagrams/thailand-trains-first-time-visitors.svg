<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">Read all three descriptions</title><desc id="desc">Class, seat versus berth, and ventilation are separate descriptions. Second class by itself does not establish that a sleeping berth is included.</desc><rect width="640" height="660" fill="#f8f7f3"/><g font-family="Arial, sans-serif"><text x="28" y="57" font-size="34" fill="#193d35" font-weight="600">Read all three descriptions</text><text x="28" y="99" font-size="24" fill="#193d35" font-weight="400">Accommodation comparison</text><path d="M28 121L612 121" fill="none" stroke="#bcc2ba" stroke-width="4"/><text x="32" y="172" font-size="32" fill="#193d35" font-weight="600">Class</text><text x="300" y="172" font-size="28" fill="#193d35" font-weight="400">First / second / third</text><path d="M28 205L612 205" fill="none" stroke="#bcc2ba" stroke-width="4"/><text x="32" y="254" font-size="32" fill="#193d35" font-weight="600">Place</text><text x="300" y="254" font-size="28" fill="#193d35" font-weight="400">Seat or sleeping berth</text><path d="M28 287L612 287" fill="none" stroke="#bcc2ba" stroke-width="4"/><text x="32" y="336" font-size="32" fill="#193d35" font-weight="600">Ventilation</text><text x="300" y="336" font-size="27" fill="#193d35" font-weight="400">Air conditioning / fan</text><rect x="28" y="405" width="584" height="172" rx="10" fill="#e8ece5"/><text x="44" y="441" font-size="26" fill="#193d35" font-weight="400">“Second class” alone does not</text><text x="44" y="477" font-size="26" fill="#193d35" font-weight="400">tell you whether it is a seat or bed.</text><text x="44" y="513" font-size="26" fill="#193d35" font-weight="400">Check the actual coach and place.</text><text x="44" y="549" font-size="26" fill="#193d35" font-weight="400">These are not all possible combos.</text></g></svg>
