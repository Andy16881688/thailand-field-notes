<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" role="img" aria-labelledby="title desc"><title id="title">Same 8 nights, more moves</title><desc id="desc">Eight-night comparison: Samui 3, Phangan 3, Samui 2 has two moves. Samui 3, Phangan 2, Tao 2, Samui 1 has three moves.</desc><rect width="640" height="820" fill="#f8f7f3"/><g font-family="Arial, sans-serif"><text x="28" y="57" font-size="34" fill="#193d35" font-weight="600">Same 8 nights, more moves</text><text x="28" y="99" font-size="24" fill="#193d35" font-weight="400">Conceptual night allocation · not a map</text><path d="M28 121L612 121" fill="none" stroke="#bcc2ba" stroke-width="4"/><text x="32" y="172" font-size="32" fill="#193d35" font-weight="600">Two island moves</text><text x="32" y="218" font-size="28" fill="#193d35" font-weight="400">Samui 3 → Phangan 3 → Samui 2</text><rect x="32" y="247" width="62" height="58" rx="10" fill="#193d35"/><rect x="104" y="247" width="62" height="58" rx="10" fill="#193d35"/><rect x="176" y="247" width="62" height="58" rx="10" fill="#193d35"/><rect x="248" y="247" width="62" height="58" rx="10" fill="#b74d35"/><rect x="320" y="247" width="62" height="58" rx="10" fill="#b74d35"/><rect x="392" y="247" width="62" height="58" rx="10" fill="#b74d35"/><rect x="464" y="247" width="62" height="58" rx="10" fill="#193d35"/><rect x="536" y="247" width="62" height="58" rx="10" fill="#193d35"/><text x="32" y="372" font-size="32" fill="#193d35" font-weight="600">Three island moves</text><text x="32" y="417" font-size="28" fill="#193d35" font-weight="400">Samui 3 → Phangan 2</text><text x="32" y="453" font-size="28" fill="#193d35" font-weight="400">→ Tao 2 → Samui 1</text><rect x="32" y="481" width="62" height="58" rx="10" fill="#193d35"/><rect x="104" y="481" width="62" height="58" rx="10" fill="#193d35"/><rect x="176" y="481" width="62" height="58" rx="10" fill="#193d35"/><rect x="248" y="481" width="62" height="58" rx="10" fill="#b74d35"/><rect x="320" y="481" width="62" height="58" rx="10" fill="#b74d35"/><rect x="392" y="481" width="62" height="58" rx="10" fill="#59645e"/><rect x="464" y="481" width="62" height="58" rx="10" fill="#59645e"/><rect x="536" y="481" width="62" height="58" rx="10" fill="#193d35"/><rect x="28" y="598" width="584" height="172" rx="10" fill="#e8ece5"/><text x="44" y="634" font-size="26" fill="#193d35" font-weight="400">Each block = one night.</text><text x="44" y="670" font-size="26" fill="#193d35" font-weight="400">Adding Tao uses existing nights;</text><text x="44" y="706" font-size="26" fill="#193d35" font-weight="400">the final Samui stay falls from 2 to 1.</text><text x="44" y="742" font-size="26" fill="#193d35" font-weight="400">Examples, not confirmed sailings.</text></g></svg>
