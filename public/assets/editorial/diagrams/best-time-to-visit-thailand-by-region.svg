<svg xmlns="http://www.w3.org/2000/svg" width="640" height="890" viewBox="0 0 640 890" role="img" aria-labelledby="title desc"><title id="title">Compare regional windows</title><desc id="desc">Broad windows: Bangkok and central November–January, north November–February, Andaman November–April, southern Gulf May–September. The first two are cooler periods; the coastal ranges are tourism-season windows.</desc><rect width="640" height="890" fill="#f8f7f3"/><g font-family="Arial, sans-serif"><text x="28" y="57" font-size="34" fill="#193d35" font-weight="600">Compare regional windows</text><text x="28" y="99" font-size="24" fill="#193d35" font-weight="400">Broad seasonal context · not a forecast</text><path d="M28 121L612 121" fill="none" stroke="#bcc2ba" stroke-width="4"/><text x="32" y="161" font-size="30" fill="#193d35" font-weight="600">Bangkok / central</text><rect x="32" y="180" width="203" height="62" rx="10" fill="#193d35"/><text x="47" y="221" font-size="30" fill="#f8f7f3" font-weight="400">Nov–Jan</text><text x="258" y="220" font-size="26" fill="#193d35" font-weight="400">Cooler period</text><text x="32" y="304" font-size="30" fill="#193d35" font-weight="600">Northern Thailand</text><rect x="32" y="323" width="203" height="62" rx="10" fill="#193d35"/><text x="47" y="364" font-size="30" fill="#f8f7f3" font-weight="400">Nov–Feb</text><text x="258" y="363" font-size="26" fill="#193d35" font-weight="400">Cooler period</text><text x="32" y="447" font-size="30" fill="#193d35" font-weight="600">Andaman coast</text><rect x="32" y="466" width="203" height="62" rx="10" fill="#b74d35"/><text x="47" y="507" font-size="30" fill="#f8f7f3" font-weight="400">Nov–Apr</text><text x="258" y="506" font-size="26" fill="#193d35" font-weight="400">Tourism-season window</text><text x="32" y="590" font-size="30" fill="#193d35" font-weight="600">Southern Gulf coast</text><rect x="32" y="609" width="203" height="62" rx="10" fill="#b74d35"/><text x="47" y="650" font-size="30" fill="#f8f7f3" font-weight="400">May–Sep</text><text x="258" y="649" font-size="26" fill="#193d35" font-weight="400">Tourism-season window</text><rect x="28" y="726" width="584" height="136" rx="10" fill="#e8ece5"/><text x="44" y="762" font-size="26" fill="#193d35" font-weight="400">Not the only months worth visiting.</text><text x="44" y="798" font-size="26" fill="#193d35" font-weight="400">Check local forecasts, air quality</text><text x="44" y="834" font-size="26" fill="#193d35" font-weight="400">and operator notices for your dates.</text></g></svg>
