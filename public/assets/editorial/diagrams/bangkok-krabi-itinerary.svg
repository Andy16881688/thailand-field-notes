<svg xmlns="http://www.w3.org/2000/svg" width="640" height="770" viewBox="0 0 640 770" role="img" aria-labelledby="title desc"><title id="title">The hotel changes the transfer</title><desc id="desc">A road-access Ao Nang property uses a road transfer. A boat-access Railay property adds a pier and boat leg before reaching the accommodation.</desc><rect width="640" height="770" fill="#f8f7f3"/><g font-family="Arial, sans-serif"><text x="28" y="57" font-size="34" fill="#193d35" font-weight="600">The hotel changes the transfer</text><text x="28" y="99" font-size="24" fill="#193d35" font-weight="400">Conceptual access chains · not a map</text><path d="M28 121L612 121" fill="none" stroke="#bcc2ba" stroke-width="4"/><text x="32" y="173" font-size="30" fill="#193d35" font-weight="600">Road-access Ao Nang property</text><path d="M52 224L52 352" fill="none" stroke="#bcc2ba" stroke-width="4"/><circle cx="52" cy="224" r="9" fill="#b74d35"/><text x="82" y="233" font-size="30" fill="#193d35" font-weight="400">Airport</text><circle cx="52" cy="288" r="9" fill="#b74d35"/><text x="82" y="297" font-size="30" fill="#193d35" font-weight="400">Road transfer</text><circle cx="52" cy="352" r="9" fill="#b74d35"/><text x="82" y="361" font-size="30" fill="#193d35" font-weight="400">Hotel entrance</text><path d="M28 397L612 397" fill="none" stroke="#bcc2ba" stroke-width="4"/><text x="32" y="446" font-size="30" fill="#193d35" font-weight="600">Boat-access Railay property</text><path d="M52 492L52 620" fill="none" stroke="#bcc2ba" stroke-width="4"/><circle cx="52" cy="492" r="9" fill="#b74d35"/><text x="82" y="501" font-size="30" fill="#193d35" font-weight="400">Airport → road → pier</text><circle cx="52" cy="556" r="9" fill="#b74d35"/><text x="82" y="565" font-size="30" fill="#193d35" font-weight="400">Boat transfer</text><circle cx="52" cy="620" r="9" fill="#b74d35"/><text x="82" y="629" font-size="30" fill="#193d35" font-weight="400">Property arrival point</text><rect x="28" y="668" width="584" height="100" rx="10" fill="#e8ece5"/><text x="44" y="704" font-size="26" fill="#193d35" font-weight="400">Confirm your own hotel’s route.</text><text x="44" y="740" font-size="26" fill="#193d35" font-weight="400">A boat outing ≠ a boat-access stay.</text></g></svg>
