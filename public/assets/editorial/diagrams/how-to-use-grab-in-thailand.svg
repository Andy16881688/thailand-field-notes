<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" role="img" aria-labelledby="title desc"><title id="title">Two pickup sequences</title><desc id="desc">A matched-car request provides driver details before meeting. The airport PIN process provides a code first, then a designated queue and waiting driver.</desc><rect width="640" height="860" fill="#f8f7f3"/><g font-family="Arial, sans-serif"><text x="28" y="57" font-size="34" fill="#193d35" font-weight="600">Two pickup sequences</text><text x="28" y="99" font-size="24" fill="#193d35" font-weight="400">Conceptual process · not an app screen</text><path d="M28 121L612 121" fill="none" stroke="#bcc2ba" stroke-width="4"/><text x="32" y="172" font-size="32" fill="#193d35" font-weight="600">Matched car</text><path d="M52 218L52 348" fill="none" stroke="#bcc2ba" stroke-width="4"/><circle cx="52" cy="218" r="9" fill="#b74d35"/><text x="82" y="227" font-size="30" fill="#193d35" font-weight="400">Receive match details</text><circle cx="52" cy="283" r="9" fill="#b74d35"/><text x="82" y="292" font-size="30" fill="#193d35" font-weight="400">Confirm the meeting point</text><circle cx="52" cy="348" r="9" fill="#b74d35"/><text x="82" y="357" font-size="30" fill="#193d35" font-weight="400">Match driver and vehicle</text><path d="M28 398L612 398" fill="none" stroke="#bcc2ba" stroke-width="4"/><text x="32" y="447" font-size="32" fill="#193d35" font-weight="600">Airport PIN queue</text><path d="M52 493L52 623" fill="none" stroke="#bcc2ba" stroke-width="4"/><circle cx="52" cy="493" r="9" fill="#b74d35"/><text x="82" y="502" font-size="30" fill="#193d35" font-weight="400">Booking gives a pickup PIN</text><circle cx="52" cy="558" r="9" fill="#b74d35"/><text x="82" y="567" font-size="30" fill="#193d35" font-weight="400">Join the designated queue</text><circle cx="52" cy="623" r="9" fill="#b74d35"/><text x="82" y="632" font-size="30" fill="#193d35" font-weight="400">Give PIN to the waiting driver</text><rect x="28" y="696" width="584" height="136" rx="10" fill="#e8ece5"/><text x="44" y="732" font-size="26" fill="#193d35" font-weight="400">Use the PIN flow only when your</text><text x="44" y="768" font-size="26" fill="#193d35" font-weight="400">actual booking directs you there.</text><text x="44" y="804" font-size="26" fill="#193d35" font-weight="400">Pickup PIN ≠ account password.</text></g></svg>
