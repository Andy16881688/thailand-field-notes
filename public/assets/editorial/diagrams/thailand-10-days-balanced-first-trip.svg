<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-labelledby="title desc"><title id="title">10 days = 9 nights</title><desc id="desc">Bangkok · nights 1–2: 2 nights; Chiang Mai · nights 3–5: 3 nights; One southern base · nights 6–8: 3 nights; Bangkok buffer · night 9: 1 night.</desc><rect width="640" height="800" fill="#f8f7f3"/><g font-family="Arial, sans-serif"><text x="28" y="57" font-size="34" fill="#193d35" font-weight="600">10 days = 9 nights</text><text x="28" y="99" font-size="24" fill="#193d35" font-weight="400">Conceptual night allocation · not a map</text><path d="M28 121L612 121" fill="none" stroke="#bcc2ba" stroke-width="4"/><text x="32" y="160" font-size="26" fill="#193d35" font-weight="400">Each block = one night</text><text x="32" y="213" font-size="28" fill="#193d35" font-weight="400">Bangkok · nights 1–2</text><rect x="32" y="229" width="40" height="34" rx="10" fill="#193d35"/><rect x="81" y="229" width="40" height="34" rx="10" fill="#193d35"/><text x="540" y="256" font-size="32" fill="#193d35" font-weight="600">2</text><text x="32" y="321" font-size="28" fill="#193d35" font-weight="400">Chiang Mai · nights 3–5</text><rect x="32" y="337" width="40" height="34" rx="10" fill="#193d35"/><rect x="81" y="337" width="40" height="34" rx="10" fill="#193d35"/><rect x="130" y="337" width="40" height="34" rx="10" fill="#193d35"/><text x="540" y="364" font-size="32" fill="#193d35" font-weight="600">3</text><text x="32" y="429" font-size="28" fill="#193d35" font-weight="400">One southern base · nights 6–8</text><rect x="32" y="445" width="40" height="34" rx="10" fill="#193d35"/><rect x="81" y="445" width="40" height="34" rx="10" fill="#193d35"/><rect x="130" y="445" width="40" height="34" rx="10" fill="#193d35"/><text x="540" y="472" font-size="32" fill="#193d35" font-weight="600">3</text><text x="32" y="537" font-size="28" fill="#193d35" font-weight="400">Bangkok buffer · night 9</text><rect x="32" y="553" width="40" height="34" rx="10" fill="#b74d35"/><text x="540" y="580" font-size="32" fill="#193d35" font-weight="600">1</text><rect x="28" y="661" width="584" height="100" rx="10" fill="#e8ece5"/><text x="44" y="697" font-size="26" fill="#193d35" font-weight="400">Arrival: Day 1. Moves: Days 3, 6, 9.</text><text x="44" y="733" font-size="26" fill="#193d35" font-weight="400">Planning example, not a schedule.</text></g></svg>
