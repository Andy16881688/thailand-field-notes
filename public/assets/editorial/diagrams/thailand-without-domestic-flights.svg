<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" role="img" aria-labelledby="title desc"><title id="title">Train nights count too</title><desc id="desc">Ten-night northern model: Bangkok three, outbound train one, Chiang Mai four, return train one and Bangkok one. Eight accommodation nights plus two train nights.</desc><rect width="640" height="860" fill="#f8f7f3"/><g font-family="Arial, sans-serif"><text x="28" y="57" font-size="34" fill="#193d35" font-weight="600">Train nights count too</text><text x="28" y="99" font-size="24" fill="#193d35" font-weight="400">Northern concept · not a timetable or map</text><path d="M28 121L612 121" fill="none" stroke="#bcc2ba" stroke-width="4"/><text x="32" y="162" font-size="26" fill="#193d35" font-weight="400">Each block = one night</text><text x="32" y="214" font-size="28" fill="#193d35" font-weight="400">Bangkok · nights 1–3</text><rect x="32" y="230" width="40" height="34" rx="10" fill="#193d35"/><rect x="81" y="230" width="40" height="34" rx="10" fill="#193d35"/><rect x="130" y="230" width="40" height="34" rx="10" fill="#193d35"/><text x="540" y="257" font-size="32" fill="#193d35" font-weight="600">3</text><text x="32" y="322" font-size="28" fill="#193d35" font-weight="400">Outbound train · night 4</text><rect x="32" y="338" width="40" height="34" rx="10" fill="#193d35"/><text x="540" y="365" font-size="32" fill="#193d35" font-weight="600">1</text><text x="32" y="430" font-size="28" fill="#193d35" font-weight="400">Chiang Mai · nights 5–8</text><rect x="32" y="446" width="40" height="34" rx="10" fill="#193d35"/><rect x="81" y="446" width="40" height="34" rx="10" fill="#193d35"/><rect x="130" y="446" width="40" height="34" rx="10" fill="#193d35"/><rect x="179" y="446" width="40" height="34" rx="10" fill="#193d35"/><text x="540" y="473" font-size="32" fill="#193d35" font-weight="600">4</text><text x="32" y="538" font-size="28" fill="#193d35" font-weight="400">Return train · night 9</text><rect x="32" y="554" width="40" height="34" rx="10" fill="#193d35"/><text x="540" y="581" font-size="32" fill="#193d35" font-weight="600">1</text><text x="32" y="646" font-size="28" fill="#193d35" font-weight="400">Bangkok · night 10</text><rect x="32" y="662" width="40" height="34" rx="10" fill="#b74d35"/><text x="540" y="689" font-size="32" fill="#193d35" font-weight="600">1</text><rect x="28" y="754" width="584" height="100" rx="10" fill="#e8ece5"/><text x="44" y="790" font-size="26" fill="#193d35" font-weight="400">8 accommodation + 2 train = 10.</text><text x="44" y="826" font-size="26" fill="#193d35" font-weight="400">Confirm suitable berths both ways.</text></g></svg>
