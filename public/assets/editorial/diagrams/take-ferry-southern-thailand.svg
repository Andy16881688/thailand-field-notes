<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" role="img" aria-labelledby="title desc"><title id="title">Plan backward from check-in</title><desc id="desc">Work backward from boat departure to the operator check-in deadline, then to hotel pickup and the land journey.</desc><rect width="640" height="720" fill="#f8f7f3"/><g font-family="Arial, sans-serif"><text x="28" y="57" font-size="34" fill="#193d35" font-weight="600">Plan backward from check-in</text><text x="28" y="99" font-size="24" fill="#193d35" font-weight="400">Timing relationship · not to scale</text><path d="M28 121L612 121" fill="none" stroke="#bcc2ba" stroke-width="4"/><path d="M72 180L72 480" fill="none" stroke="#bcc2ba" stroke-width="4"/><circle cx="72" cy="180" r="9" fill="#b74d35"/><circle cx="72" cy="330" r="9" fill="#b74d35"/><circle cx="72" cy="480" r="9" fill="#b74d35"/><text x="106" y="188" font-size="32" fill="#193d35" font-weight="400">Hotel pickup</text><text x="106" y="229" font-size="26" fill="#193d35" font-weight="400">Allow the land journey</text><text x="106" y="338" font-size="32" fill="#193d35" font-weight="400">Operator check-in</text><text x="106" y="379" font-size="26" fill="#193d35" font-weight="400">Use your booking’s deadline</text><text x="106" y="488" font-size="32" fill="#193d35" font-weight="400">Boat departure</text><path d="M570 468L570 190" fill="none" stroke="#b74d35" stroke-width="4"/><text x="335" y="540" font-size="28" fill="#b74d35" font-weight="400">↑ Work backward</text><rect x="28" y="580" width="584" height="136" rx="10" fill="#e8ece5"/><text x="44" y="616" font-size="26" fill="#193d35" font-weight="400">Lomprayah example: check in</text><text x="44" y="652" font-size="26" fill="#193d35" font-weight="400">at least 60 min before departure.</text><text x="44" y="688" font-size="26" fill="#193d35" font-weight="400">Not a rule for every ferry operator.</text></g></svg>
