<svg xmlns="http://www.w3.org/2000/svg" width="640" height="780" viewBox="0 0 640 780" role="img" aria-labelledby="title desc"><title id="title">Compare room to room</title><desc id="desc">Flight comparison includes leaving the hotel, airport travel, check-in, security, boarding, flight, bags and onward transfer to the next hotel.</desc><rect width="640" height="780" fill="#f8f7f3"/><g font-family="Arial, sans-serif"><text x="28" y="57" font-size="34" fill="#193d35" font-weight="600">Compare room to room</text><text x="28" y="99" font-size="24" fill="#193d35" font-weight="400">Journey components · no duration scale</text><path d="M28 121L612 121" fill="none" stroke="#bcc2ba" stroke-width="4"/><path d="M52 165L52 540" fill="none" stroke="#bcc2ba" stroke-width="4"/><circle cx="52" cy="165" r="9" fill="#b74d35"/><text x="82" y="174" font-size="30" fill="#193d35" font-weight="400">Leave first hotel</text><circle cx="52" cy="240" r="9" fill="#b74d35"/><text x="82" y="249" font-size="30" fill="#193d35" font-weight="400">Travel to the airport</text><circle cx="52" cy="315" r="9" fill="#b74d35"/><text x="82" y="324" font-size="30" fill="#193d35" font-weight="400">Check-in · security · board</text><circle cx="52" cy="390" r="9" fill="#b74d35"/><text x="82" y="399" font-size="30" fill="#193d35" font-weight="400">Flight</text><circle cx="52" cy="465" r="9" fill="#b74d35"/><text x="82" y="474" font-size="30" fill="#193d35" font-weight="400">Bags · onward transfer</text><circle cx="52" cy="540" r="9" fill="#b74d35"/><text x="82" y="549" font-size="30" fill="#193d35" font-weight="400">Reach next hotel</text><rect x="28" y="358" width="584" height="59" rx="10" fill="#193d35"/><text x="82" y="398" font-size="30" fill="#f8f7f3" font-weight="400">Flight</text><rect x="28" y="648" width="584" height="100" rx="10" fill="#e8ece5"/><text x="44" y="684" font-size="26" fill="#193d35" font-weight="400">Compare this whole chain with rail</text><text x="44" y="720" font-size="26" fill="#193d35" font-weight="400">or road, including bags and costs.</text></g></svg>
