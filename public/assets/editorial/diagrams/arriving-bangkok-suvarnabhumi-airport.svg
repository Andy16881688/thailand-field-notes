<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" role="img" aria-labelledby="title desc"><title id="title">Arrival before the city</title><desc id="desc">From SAT-1 Level 2, take the B2 people mover to main-terminal Level 2, then passport control, bags, customs and public arrivals.</desc><rect width="640" height="760" fill="#f8f7f3"/><g font-family="Arial, sans-serif"><text x="28" y="57" font-size="34" fill="#193d35" font-weight="600">Arrival before the city</text><text x="28" y="99" font-size="24" fill="#193d35" font-weight="400">Process diagram · international arrival</text><path d="M28 121L612 121" fill="none" stroke="#bcc2ba" stroke-width="4"/><rect x="28" y="134" width="584" height="140" rx="10" fill="#e8ece5"/><text x="44" y="173" font-size="28" fill="#193d35" font-weight="400">If arriving at SAT-1: Level 2</text><text x="44" y="209" font-size="28" fill="#193d35" font-weight="400">↓ B2 Automated People Mover</text><text x="44" y="245" font-size="28" fill="#193d35" font-weight="400">↓ main terminal Level 2</text><path d="M52 320L52 581" fill="none" stroke="#bcc2ba" stroke-width="4"/><circle cx="52" cy="320" r="9" fill="#b74d35"/><text x="82" y="329" font-size="30" fill="#193d35" font-weight="400">Passport control</text><circle cx="52" cy="407" r="9" fill="#b74d35"/><text x="82" y="416" font-size="30" fill="#193d35" font-weight="400">Baggage collection</text><circle cx="52" cy="494" r="9" fill="#b74d35"/><text x="82" y="503" font-size="30" fill="#193d35" font-weight="400">Customs</text><circle cx="52" cy="581" r="9" fill="#b74d35"/><text x="82" y="590" font-size="30" fill="#193d35" font-weight="400">Public arrivals</text><rect x="28" y="646" width="584" height="100" rx="10" fill="#e8ece5"/><text x="44" y="682" font-size="26" fill="#193d35" font-weight="400">Airport people mover ≠ city rail.</text><text x="44" y="718" font-size="26" fill="#193d35" font-weight="400">Onward flight? Ask airline staff first.</text></g></svg>
