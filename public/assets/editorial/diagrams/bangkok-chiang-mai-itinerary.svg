<svg xmlns="http://www.w3.org/2000/svg" width="640" height="770" viewBox="0 0 640 770" role="img" aria-labelledby="title desc"><title id="title">A sleeper replaces a room</title><desc id="desc">Flight version: two Bangkok hotel nights and four Chiang Mai nights. Sleeper version: one Bangkok hotel night, one train night and four Chiang Mai nights.</desc><rect width="640" height="770" fill="#f8f7f3"/><g font-family="Arial, sans-serif"><text x="28" y="57" font-size="34" fill="#193d35" font-weight="600">A sleeper replaces a room</text><text x="28" y="99" font-size="24" fill="#193d35" font-weight="400">Six-night comparison · not a timetable</text><path d="M28 121L612 121" fill="none" stroke="#bcc2ba" stroke-width="4"/><text x="32" y="172" font-size="32" fill="#193d35" font-weight="600">Flight north on Day 3</text><text x="32" y="222" font-size="28" fill="#193d35" font-weight="400">Bangkok 2 + Chiang Mai 4</text><rect x="32" y="249" width="83" height="58" rx="10" fill="#193d35"/><rect x="128" y="249" width="83" height="58" rx="10" fill="#193d35"/><rect x="224" y="249" width="83" height="58" rx="10" fill="#b74d35"/><rect x="320" y="249" width="83" height="58" rx="10" fill="#b74d35"/><rect x="416" y="249" width="83" height="58" rx="10" fill="#b74d35"/><rect x="512" y="249" width="83" height="58" rx="10" fill="#b74d35"/><text x="32" y="379" font-size="32" fill="#193d35" font-weight="600">Train on night 2</text><text x="32" y="429" font-size="28" fill="#193d35" font-weight="400">Bangkok 1 + train 1 + Chiang Mai 4</text><rect x="32" y="457" width="83" height="58" rx="10" fill="#193d35"/><rect x="128" y="457" width="83" height="58" rx="10" fill="#59645e"/><rect x="224" y="457" width="83" height="58" rx="10" fill="#b74d35"/><rect x="320" y="457" width="83" height="58" rx="10" fill="#b74d35"/><rect x="416" y="457" width="83" height="58" rx="10" fill="#b74d35"/><rect x="512" y="457" width="83" height="58" rx="10" fill="#b74d35"/><rect x="28" y="580" width="584" height="172" rx="10" fill="#e8ece5"/><text x="44" y="616" font-size="26" fill="#193d35" font-weight="400">Each block = one night; both total 6.</text><text x="44" y="652" font-size="26" fill="#193d35" font-weight="400">Both assume departure from</text><text x="44" y="688" font-size="26" fill="#193d35" font-weight="400">Chiang Mai on Day 7.</text><text x="44" y="724" font-size="26" fill="#193d35" font-weight="400">A sleeper adds no extra night.</text></g></svg>
