<svg xmlns="http://www.w3.org/2000/svg" width="640" height="910" viewBox="0 0 640 910" role="img" aria-labelledby="title desc"><title id="title">Two airports, different rail</title><desc id="desc">BKK uses Airport Rail Link to Phaya Thai for BTS or Makkasan for Phetchaburi MRT; DMK uses Red Line to Krung Thep Aphiwat with the Blue Line connection at Bang Sue.</desc><rect width="640" height="910" fill="#f8f7f3"/><g font-family="Arial, sans-serif"><text x="28" y="57" font-size="34" fill="#193d35" font-weight="600">Two airports, different rail</text><text x="28" y="99" font-size="24" fill="#193d35" font-weight="400">Conceptual connections · not a map</text><path d="M28 121L612 121" fill="none" stroke="#bcc2ba" stroke-width="4"/><text x="32" y="163" font-size="32" fill="#193d35" font-weight="600">BKK · Suvarnabhumi</text><path d="M52 211L52 211" fill="none" stroke="#bcc2ba" stroke-width="4"/><circle cx="52" cy="211" r="9" fill="#b74d35"/><text x="82" y="220" font-size="30" fill="#193d35" font-weight="400">Airport Rail Link</text><path d="M52 230L52 272" fill="none" stroke="#b74d35" stroke-width="4"/><path d="M52 272L334 272" fill="none" stroke="#b74d35" stroke-width="4"/><path d="M334 272L334 292" fill="none" stroke="#b74d35" stroke-width="4"/><text x="44" y="318" font-size="28" fill="#193d35" font-weight="400">Phaya Thai</text><text x="44" y="354" font-size="28" fill="#193d35" font-weight="400">↓ BTS</text><text x="334" y="318" font-size="26" fill="#193d35" font-weight="400">Makkasan</text><text x="334" y="354" font-size="26" fill="#193d35" font-weight="400">↓ Phetchaburi MRT</text><path d="M28 402L612 402" fill="none" stroke="#bcc2ba" stroke-width="4"/><text x="32" y="451" font-size="32" fill="#193d35" font-weight="600">DMK · Don Mueang</text><path d="M52 501L52 655" fill="none" stroke="#bcc2ba" stroke-width="4"/><circle cx="52" cy="501" r="9" fill="#b74d35"/><text x="82" y="510" font-size="30" fill="#193d35" font-weight="400">Red Line</text><circle cx="52" cy="578" r="9" fill="#b74d35"/><text x="82" y="587" font-size="30" fill="#193d35" font-weight="400">Krung Thep Aphiwat</text><circle cx="52" cy="655" r="9" fill="#b74d35"/><text x="82" y="664" font-size="30" fill="#193d35" font-weight="400">Bang Sue · Blue Line</text><rect x="28" y="724" width="584" height="136" rx="10" fill="#e8ece5"/><text x="44" y="760" font-size="26" fill="#193d35" font-weight="400">Transfers between systems.</text><text x="44" y="796" font-size="26" fill="#193d35" font-weight="400">Add the final station-to-hotel leg.</text><text x="44" y="832" font-size="26" fill="#193d35" font-weight="400">Check service hours for every leg.</text></g></svg>
