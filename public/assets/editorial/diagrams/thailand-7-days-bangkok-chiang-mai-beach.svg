<svg xmlns="http://www.w3.org/2000/svg" width="640" height="930" viewBox="0 0 640 930" role="img" aria-labelledby="title desc"><title id="title">Only two fully free days</title><desc id="desc">In the compressed seven-day route, Days 1 and 7 are arrival and departure, Days 2, 4 and 6 are transfers, and only Days 3 and 5 are fully free.</desc><rect width="640" height="930" fill="#f8f7f3"/><g font-family="Arial, sans-serif"><text x="28" y="57" font-size="34" fill="#193d35" font-weight="600">Only two fully free days</text><text x="28" y="99" font-size="24" fill="#193d35" font-weight="400">Compressed three-region planning model</text><path d="M28 121L612 121" fill="none" stroke="#bcc2ba" stroke-width="4"/><rect x="28" y="143" width="584" height="64" rx="10" fill="#e8ece5"/><text x="46" y="185" font-size="30" fill="#193d35" font-weight="400">1  Arrival · Bangkok</text><rect x="28" y="223" width="584" height="64" rx="10" fill="#e8ece5"/><text x="46" y="265" font-size="30" fill="#193d35" font-weight="400">2  Move · Chiang Mai</text><rect x="28" y="303" width="584" height="64" rx="10" fill="#193d35"/><text x="46" y="345" font-size="30" fill="#f8f7f3" font-weight="400">3  Full northern day</text><rect x="28" y="383" width="584" height="64" rx="10" fill="#e8ece5"/><text x="46" y="425" font-size="30" fill="#193d35" font-weight="400">4  Move · coastal base</text><rect x="28" y="463" width="584" height="64" rx="10" fill="#193d35"/><text x="46" y="505" font-size="30" fill="#f8f7f3" font-weight="400">5  Full coastal day</text><rect x="28" y="543" width="584" height="64" rx="10" fill="#e8ece5"/><text x="46" y="585" font-size="30" fill="#193d35" font-weight="400">6  Move · Bangkok</text><rect x="28" y="623" width="584" height="64" rx="10" fill="#e8ece5"/><text x="46" y="665" font-size="30" fill="#193d35" font-weight="400">7  International departure</text><rect x="28" y="738" width="584" height="172" rx="10" fill="#e8ece5"/><text x="44" y="774" font-size="26" fill="#193d35" font-weight="400">6 nights = Bangkok 1 + north 2</text><text x="44" y="810" font-size="26" fill="#193d35" font-weight="400">+ coast 2 + Bangkok 1.</text><text x="44" y="846" font-size="26" fill="#193d35" font-weight="400">Dates and connections unconfirmed.</text><text x="44" y="882" font-size="26" fill="#193d35" font-weight="400">Usually prefer two destinations.</text></g></svg>
