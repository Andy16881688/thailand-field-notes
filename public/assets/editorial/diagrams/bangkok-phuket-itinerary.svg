<svg xmlns="http://www.w3.org/2000/svg" width="640" height="785" viewBox="0 0 640 785" role="img" aria-labelledby="title desc"><title id="title">Your exit changes night 6</title><desc id="desc">Phuket exit: Bangkok two nights and Phuket four. Bangkok return: Bangkok two, Phuket three and Bangkok one; night 6 moves from Phuket to Bangkok.</desc><rect width="640" height="785" fill="#f8f7f3"/><g font-family="Arial, sans-serif"><text x="28" y="57" font-size="34" fill="#193d35" font-weight="600">Your exit changes night 6</text><text x="28" y="99" font-size="24" fill="#193d35" font-weight="400">Conceptual night allocation · not a map</text><path d="M28 121L612 121" fill="none" stroke="#bcc2ba" stroke-width="4"/><text x="32" y="173" font-size="32" fill="#193d35" font-weight="600">Exit from Phuket</text><text x="32" y="221" font-size="28" fill="#193d35" font-weight="400">Bangkok 2 + Phuket 4</text><rect x="32" y="247" width="83" height="58" rx="10" fill="#193d35"/><rect x="128" y="247" width="83" height="58" rx="10" fill="#193d35"/><rect x="224" y="247" width="83" height="58" rx="10" fill="#b74d35"/><rect x="320" y="247" width="83" height="58" rx="10" fill="#b74d35"/><rect x="416" y="247" width="83" height="58" rx="10" fill="#b74d35"/><rect x="512" y="247" width="83" height="58" rx="10" fill="#b74d35"/><text x="32" y="350" font-size="28" fill="#193d35" font-weight="400">Three full intervening Phuket days</text><text x="32" y="428" font-size="32" fill="#193d35" font-weight="600">Return to Bangkok</text><text x="32" y="476" font-size="28" fill="#193d35" font-weight="400">Bangkok 2 + Phuket 3 + Bangkok 1</text><rect x="32" y="502" width="83" height="58" rx="10" fill="#193d35"/><rect x="128" y="502" width="83" height="58" rx="10" fill="#193d35"/><rect x="224" y="502" width="83" height="58" rx="10" fill="#b74d35"/><rect x="320" y="502" width="83" height="58" rx="10" fill="#b74d35"/><rect x="416" y="502" width="83" height="58" rx="10" fill="#b74d35"/><rect x="512" y="502" width="83" height="58" rx="10" fill="#193d35"/><text x="32" y="605" font-size="28" fill="#193d35" font-weight="400">Two full intervening Phuket days</text><rect x="28" y="650" width="584" height="100" rx="10" fill="#e8ece5"/><text x="44" y="686" font-size="26" fill="#193d35" font-weight="400">Each block = one night; both total 6.</text><text x="44" y="722" font-size="26" fill="#193d35" font-weight="400">Confirm the international exit first.</text></g></svg>
