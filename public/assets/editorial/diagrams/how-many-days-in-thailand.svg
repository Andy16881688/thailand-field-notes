<svg xmlns="http://www.w3.org/2000/svg" width="640" height="740" viewBox="0 0 640 740" role="img" aria-labelledby="title desc"><title id="title">Seven dates ≠ seven full days</title><desc id="desc">Monday evening to Sunday morning spans seven calendar dates, six nights and five intervening days. Subtract two transfer-shaped days to leave three relatively free days.</desc><rect width="640" height="740" fill="#f8f7f3"/><g font-family="Arial, sans-serif"><text x="28" y="57" font-size="34" fill="#193d35" font-weight="600">Seven dates ≠ seven full days</text><text x="28" y="99" font-size="24" fill="#193d35" font-weight="400">The article’s Monday–Sunday example</text><path d="M28 121L612 121" fill="none" stroke="#bcc2ba" stroke-width="4"/><text x="32" y="180" font-size="40" fill="#193d35" font-weight="600">7 calendar dates</text><text x="32" y="226" font-size="28" fill="#193d35" font-weight="400">Monday evening → Sunday morning</text><path d="M52 256L52 343" fill="none" stroke="#b74d35" stroke-width="4"/><text x="84" y="306" font-size="26" fill="#193d35" font-weight="400">Arrival and departure at the edges</text><text x="32" y="387" font-size="40" fill="#193d35" font-weight="600">5 intervening days</text><rect x="32" y="420" width="100" height="64" rx="10" fill="#b74d35"/><rect x="147" y="420" width="100" height="64" rx="10" fill="#b74d35"/><rect x="262" y="420" width="100" height="64" rx="10" fill="#193d35"/><rect x="377" y="420" width="100" height="64" rx="10" fill="#193d35"/><rect x="492" y="420" width="100" height="64" rx="10" fill="#193d35"/><text x="32" y="540" font-size="28" fill="#b74d35" font-weight="400">− 2 days largely changing bases</text><text x="32" y="593" font-size="36" fill="#193d35" font-weight="600">= 3 relatively free days</text><rect x="28" y="629" width="584" height="64" rx="10" fill="#e8ece5"/><text x="44" y="665" font-size="26" fill="#193d35" font-weight="400">6 nights. Illustration, not a minimum.</text></g></svg>
