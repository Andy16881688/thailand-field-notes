<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" role="img" aria-labelledby="title desc"><title id="title">The train is the middle leg</title><desc id="desc">A complete rail journey links the hotel entrance, station approach, train ride, arrival station and final street address.</desc><rect width="640" height="720" fill="#f8f7f3"/><g font-family="Arial, sans-serif"><text x="28" y="57" font-size="34" fill="#193d35" font-weight="600">The train is the middle leg</text><text x="28" y="99" font-size="24" fill="#193d35" font-weight="400">Conceptual journey · not a map</text><path d="M28 121L612 121" fill="none" stroke="#bcc2ba" stroke-width="4"/><path d="M52 160L52 520" fill="none" stroke="#bcc2ba" stroke-width="4"/><circle cx="52" cy="160" r="9" fill="#b74d35"/><text x="82" y="169" font-size="30" fill="#193d35" font-weight="400">Hotel entrance</text><circle cx="52" cy="232" r="9" fill="#b74d35"/><text x="82" y="241" font-size="30" fill="#193d35" font-weight="400">Walk or local connection</text><circle cx="52" cy="304" r="9" fill="#b74d35"/><text x="82" y="313" font-size="30" fill="#193d35" font-weight="400">Departure station</text><circle cx="52" cy="376" r="9" fill="#b74d35"/><text x="82" y="385" font-size="30" fill="#193d35" font-weight="400">Rail journey</text><circle cx="52" cy="448" r="9" fill="#b74d35"/><text x="82" y="457" font-size="30" fill="#193d35" font-weight="400">Arrival station</text><circle cx="52" cy="520" r="9" fill="#b74d35"/><text x="82" y="529" font-size="30" fill="#193d35" font-weight="400">Final street address</text><rect x="28" y="348" width="584" height="61" rx="10" fill="#193d35"/><text x="82" y="385" font-size="30" fill="#f8f7f3" font-weight="400">Rail journey</text><rect x="28" y="614" width="584" height="100" rx="10" fill="#e8ece5"/><text x="44" y="650" font-size="26" fill="#193d35" font-weight="400">Check both street-level legs.</text><text x="44" y="686" font-size="26" fill="#193d35" font-weight="400">BTS and MRT ticket rules differ.</text></g></svg>
